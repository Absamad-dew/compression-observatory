name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_example.py
      - run: compression-observatory generate corpus --records 50
      - run: compression-observatory bench corpus --codecs gzip:1,zlib:6,bz2:1,lzma:0 --warmups 1 --repeats 3 --json results/ci.json --html results/ci.html
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.python }}
          path: results/
